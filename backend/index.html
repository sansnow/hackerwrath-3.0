<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edgerunners · Scam Check</title>
    <meta name="description" content="Live scam warnings during phone calls, in English, Hindi and Punjabi." />
    <meta name="theme-color" content="#F4F1EA" />
    <script>
      // Apply the saved edition before first paint, so Premium never flashes paper.
      try {
        if (localStorage.getItem('edgerunners_edition') === 'premium') {
          document.documentElement.dataset.edition = 'premium';
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700;800&family=Anek+Devanagari:wght@400;500;600;700;800&family=Anek+Gurmukhi:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&family=Tiro+Gurmukhi&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
